<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistant IA — Polytech INTL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* La page prend exactement la taille de l'écran, sans scroll */
    body {
      background-color: #f3f4f6;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      height: 100vh; /* Force la hauteur à 100% de l'écran */
      overflow: hidden; /* Empêche le défilement */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between; /* Répartit l'espace : haut, milieu, bas */
      padding: 15px; /* Marge globale réduite */
    }

    /* ===== En-tête avec le Logo ===== */
    header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 2px solid #9ca3af;
      margin-bottom: 15px;
      flex-shrink: 0; /* Empêche l'en-tête de s'écraser */
    }

    .logo-fac {
      height: 85px; /* Légèrement réduit pour gagner de la place */
      width: auto;
    }

    /* ===== Conteneur de l'avatar (le cadre) ===== */
    .video-container {
      width: 100%;
      max-width: 1200px;
      flex-grow: 1; /* Prend tout l'espace disponible au centre */
      max-height: 72vh; /* Ne dépassera jamais 72% de la hauteur de l'écran */
      aspect-ratio: 16 / 9; /* Format paysage */
      background-color: #e5e7eb;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      position: relative;
      border: 1px solid #d1d5db;
      margin-bottom: 15px;
    }

    #avatarVideo {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Remplit bien le cadre */
      display: block;
    }

    /* ===== Statut (dans le cadre) ===== */
    #status {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: 500;
      color: #e5e7eb;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      text-align: center;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    /* ===== Bouton audio (caché) ===== */
    #audioUnlock { display: none; }

    /* ===== Bouton micro (sous le cadre) ===== */
    #micToggle {
      margin-top: 5px;
      margin-bottom: 10px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      flex-shrink: 0; /* Empêche le bouton de s'écraser */
    }

    #micToggle.mic-active {
      background: #10b981;
      color: white;
      animation: pulse-ring 2s infinite;
    }
    #micToggle.mic-active:hover { background: #059669; }

    #micToggle.mic-muted {
      background: #6b7280;
      color: white;
    }
    #micToggle.mic-muted:hover { background: #4b5563; }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
      70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
  </style>
</head>
<body>

  <!-- 1. Le Logo tout en haut -->
  <header>
    <img src="logofac1.png" alt="Polytech INTL" class="logo-fac">
  </header>

  <!-- 2. Le cadre de l'avatar -->
  <div class="video-container">
    <!-- muted : sinon Chrome peut bloquer l'autoplay. Le son passe par un élément <audio> séparé. -->
    <video id="avatarVideo" autoplay playsinline muted></video>
    <div id="status">Connexion…</div>
  </div>

  <!-- 3. Le bouton micro -->
  <button id="micToggle" class="mic-muted">🔇 Micro coupé</button>
  <button id="audioUnlock">🔊 Audio</button>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <script>
    // L'URL et le jeton sont fournis par agent/src/token_server.py (GET /token) :
    // ouvrir la page via http://localhost:8080, pas en double-cliquant sur le fichier.
    const statusEl = document.getElementById("status");
    const videoEl = document.getElementById("avatarVideo");

    const room = new LivekitClient.Room();

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, publication, participant) => {
      console.log("piste reçue :", track.kind, "de", participant.identity);
      if (track.kind === "video") {
        track.attach(videoEl);
        statusEl.textContent = "Avatar connecté ✅";
        setTimeout(() => { statusEl.style.opacity = "0"; }, 3000);
      }
      if (track.kind === "audio") {
        // 🔥 CORRECTION ICI : On attache l'audio au DOM pour pouvoir l'entendre
        const audioElement = track.attach();
        document.body.appendChild(audioElement);
      }
    });

    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
      if (track.kind === "video") {
        statusEl.textContent = "Avatar déconnecté — relancez l'agent et le dispatch";
        statusEl.style.opacity = "1";
      }
    });

    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      statusEl.textContent = "Déconnecté ❌ — rechargez ou relancez l'agent";
      statusEl.style.opacity = "1";
    });

    // ===== Bouton micro (toggle) =====
    const micToggle = document.getElementById('micToggle');
    let micEnabled = false;
    let audioUnlocked = false;

    micToggle.addEventListener('click', async () => {
      try {
        if (!audioUnlocked) {
          await room.startAudio();
          audioUnlocked = true;
          statusEl.textContent = "Audio activé ✅";
        }

        micEnabled = !micEnabled;
        await room.localParticipant.setMicrophoneEnabled(micEnabled, {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        });

        if (micEnabled) {
          micToggle.textContent = '🔊 Micro actif';
          micToggle.classList.remove('mic-muted');
          micToggle.classList.add('mic-active');
        } else {
          micToggle.textContent = '🔇 Micro coupé';
          micToggle.classList.remove('mic-active');
          micToggle.classList.add('mic-muted');
        }
      } catch (err) {
        console.error('Erreur micro :', err);
      }
    });

    (async () => {
      try {
        const res = await fetch("/token");
        if (!res.ok) throw new Error("serveur de jetons indisponible (" + res.status + ")");
        const { url, token, agent } = await res.json();
        console.log("agent :", agent);
        await room.connect(url, token);
        console.log("connecté, participants présents :",
          [...room.remoteParticipants.values()].map(p => p.identity));
        statusEl.textContent = "Connecté — cliquez sur le bouton micro pour commencer";
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Erreur : " + err.message;
      }
    })();
  </script>

</body>
</html>
