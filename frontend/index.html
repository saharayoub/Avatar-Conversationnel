<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistant IA — Plein Écran</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* Le fond de la page devient sombre pour faire ressortir la vidéo */
    body {
      background-color: #0f172a;
      width: 100vw;
      height: 100vh;
      overflow: hidden; /* Empêche les barres de défilement */
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* L'avatar prend tout l'écran, sans bordure */
    #avatarVideo {
      width: 100vw;
      height: 100vh;
      object-fit: contain; /* Affiche l'avatar en entier sans le couper */
      display: block;
    }

    /* ===== Bouton audio (caché) ===== */
    #audioUnlock { display: none; }

    /* ===== Bouton micro flottant ===== */
    #micToggle {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
      z-index: 10;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    #micToggle.mic-active {
      background: #10b981;
      color: white;
      animation: pulse-ring 2s infinite;
    }
    #micToggle.mic-active:hover { background: #059669; }

    #micToggle.mic-muted {
      background: #6b7280;
      color: white;
    }
    #micToggle.mic-muted:hover { background: #4b5563; }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
      70% { box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* ===== Statut flottant en haut ===== */
    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: 500;
      color: #e5e7eb;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      text-align: center;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- La vidéo prend tout l'écran -->
  <video id="avatarVideo" autoplay playsinline></video>
  
  <!-- Éléments flottants -->
  <div id="status">Connexion…</div>
  <button id="micToggle" class="mic-muted">🔇 Micro coupé</button>
  <button id="audioUnlock">🔊 Audio</button>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <script>
    // ⚠️ Remplacez cette ligne par votre token frais
    const LIVEKIT_URL = "wss://test-vjsyazm0.livekit.cloud";
    const LIVEKIT_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJBUElkZHNMckpXRWtZUDUiLCJzdWIiOiJzcGVjdGF0ZXVyIiwiZXhwIjoxNzkyNzQ2NTUwLCJuYmYiOjE3OTI2NjAxNTAsImlhdCI6MTc5MjY2MDE1MCwiaWRlbnRpdHkiOiJzcGVjdGF0ZXVyIiwibmFtZSI6InNwZWN0YXRldXIiLCJ2aWRlbyI6eyJyb29tSm9pbiI6dHJ1ZSwicm9vbSI6Im1hLXNhbGxlLXRlc3QifX0.6cD2-a7bOFQ049aJehZRGA7Ktj80aoOWWxIvBfWcU5s";

    const statusEl = document.getElementById("status");
    const videoEl = document.getElementById("avatarVideo");
    const audioBtn = document.getElementById("audioUnlock") || { classList: { add: () => {} }, addEventListener: () => {} }

    const room = new LivekitClient.Room();

    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === "video") {
        track.attach(videoEl);
        statusEl.textContent = "Avatar connecté ✅";
        // On cache le statut après 3 secondes pour faire plus propre
        setTimeout(() => { statusEl.style.opacity = "0"; }, 3000);
      }
      if (track.kind === "audio") {
        track.attach();
      }
    });

    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
      if (track.kind === "video") {
        statusEl.textContent = "Avatar déconnecté — relancez l'agent et le dispatch";
        statusEl.style.opacity = "1";
      }
    });

    room.on(LivekitClient.RoomEvent.Disconnected, () => {
      statusEl.textContent = "Déconnecté ❌ — rechargez ou relancez l'agent";
      statusEl.style.opacity = "1";
    });

     // Le bouton audio devient inutile (on garde juste le HTML caché)
    // audioBtn n'est plus utilisé

        // ===== Bouton micro (toggle) =====
    const micToggle = document.getElementById('micToggle');
    let micEnabled = false;      // État actuel : micro coupé au démarrage
    let audioUnlocked = false;   // Audio pas encore débloqué

    micToggle.addEventListener('click', async () => {
      try {
        // --- Premier clic : débloquer l'audio ---
        if (!audioUnlocked) {
          await room.startAudio();
          audioUnlocked = true;
          statusEl.textContent = "Audio activé ✅";
        }

        // --- Basculer l'état du micro ---
        micEnabled = !micEnabled;
        await room.localParticipant.setMicrophoneEnabled(micEnabled);

        // --- Mettre à jour le bouton ---
        if (micEnabled) {
          // Micro activé → bouton VERT
          micToggle.textContent = '🔊 Micro actif';
          micToggle.classList.remove('mic-muted');
          micToggle.classList.add('mic-active');
        } else {
          // Micro coupé → bouton GRIS
          micToggle.textContent = '🔇 Micro coupé';
          micToggle.classList.remove('mic-active');
          micToggle.classList.add('mic-muted');
        }
      } catch (err) {
        console.error('Erreur micro :', err);
      }
    });

    (async () => {
      try {
        await room.connect(LIVEKIT_URL, LIVEKIT_TOKEN);
        statusEl.textContent = "Connecté — cliquez sur le bouton micro pour commencer";
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Erreur : " + err.message;
      }
    })();
  </script>
</body>
</html>
